services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: customer_dw
      POSTGRES_USER: etl_user
      POSTGRES_PASSWORD: etl_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl_user -d customer_dw"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
